[project]
name = "orchestrate-sept-2026"
version = "0.1.0"
description = "Buy or Wait financial affordability engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.40.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
]

[tool.mypy]
strict = true
python_version = "3.14"


